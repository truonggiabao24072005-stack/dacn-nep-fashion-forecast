{% extends 'shop/base.html' %}
{% block content %}
<article class="container editorial-page">
  <a class="text-link" href="{% url 'shop_news' %}">← Tin tức</a>
  <header class="editorial-header">
    <p class="editorial-date">{{ post.published_at|date:'d/m/Y' }}</p>
    <h1>{{ post.title }}</h1>
    <p>{{ post.summary }}</p>
  </header>
  <div class="editorial-body">{{ post.body|linebreaks }}</div>
</article>
{% endblock %}
