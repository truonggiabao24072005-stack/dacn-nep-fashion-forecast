{% if page.has_other_pages %}<div class="pagination"><span>Trang {{ page.number }} / {{ page.paginator.num_pages }} · {{ page.paginator.count }} dòng</span><div>{% if page.has_previous %}<a class="btn small" href="?page={{ page.previous_page_number }}&q={{ q|urlencode }}&mode={{ mode|default:'' }}&dataset={{ selected.pk|default:'' }}&active={{ active|default:'' }}">Trước</a>{% endif %}{% if page.has_next %}<a class="btn small" href="?page={{ page.next_page_number }}&q={{ q|urlencode }}&mode={{ mode|default:'' }}&dataset={{ selected.pk|default:'' }}&active={{ active|default:'' }}">Tiếp</a>{% endif %}</div></div>{% endif %}
